name: restore-intel-npu-sources

on:
  workflow_dispatch:
  push:
    branches: [feature/intel-npu]
    paths:
      - 'docs/intel-npu/.restore-marker'

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/intel-npu
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "gkuhns"
          git config user.email "gkuhns@gmail.com"

      - name: Fetch and merge upstream main (Handy 0.9.5)
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/cjpais/Handy.git || true
          git fetch upstream main
          echo "upstream HEAD: $(git rev-parse upstream/main)"
          echo "commits ahead: $(git rev-list --count HEAD..upstream/main)"
          # Merge; conflict resolution is scripted below
          git merge upstream/main --no-edit -m "merge(upstream): full Handy 0.9.5 into feature/intel-npu" || true

      - name: Resolve Cargo.toml (0.9.5 + ort-openvino fork)
        run: |
          set -euo pipefail
          if grep -q '<<<<<<' src-tauri/Cargo.toml 2>/dev/null; then
            git checkout --theirs src-tauri/Cargo.toml
          fi
          python3 <<'PY'
          import re
          from pathlib import Path
          p = Path("src-tauri/Cargo.toml")
          text = p.read_text()
          text = re.sub(r'^version = ".*"', 'version = "0.9.5"', text, count=1, flags=re.M)
          text = re.sub(
              r'transcribe-rs = \{[^}]+\}',
              'transcribe-rs = { git = "https://github.com/gkuhns/transcribe-rs", default-features = false, features = ["onnx", "ort-openvino"] }',
              text,
              count=1,
          )
          if "Fork with Intel OpenVINO" not in text:
              text = text.replace(
                  'transcribe-rs = { git = "https://github.com/gkuhns/transcribe-rs"',
                  '# Fork with Intel OpenVINO / NPU support (gkuhns). Not pushed upstream.\n# Aligned to Handy 0.9.5.\ntranscribe-rs = { git = "https://github.com/gkuhns/transcribe-rs"',
              )
          p.write_text(text)
          print("Cargo.toml resolved")
          for line in text.splitlines():
              if any(x in line for x in ["version =", "transcribe-rs", "transcribe-cpp", "whatlang", "handy-keys"]):
                  print(" ", line)
          PY

      - name: Resolve build.yml (upstream + unsigned NPU patch)
        run: |
          set -euo pipefail
          if grep -q '<<<<<<' .github/workflows/build.yml 2>/dev/null; then
            git checkout --theirs .github/workflows/build.yml
          fi
          python3 <<'PY'
          from pathlib import Path
          p = Path(".github/workflows/build.yml")
          lines = p.read_text().splitlines(keepends=True)
          text = "".join(lines)
          if "Disable Windows signCommand" in text:
              print("Unsigned patch already present")
          else:
              insert_at = None
              for i, line in enumerate(lines):
                  if "Install SPIRV-Headers" in line or "SPIRV-Headers for transcribe-cpp" in line:
                      for j in range(i+1, len(lines)):
                          if lines[j].startswith("      - name:") or (lines[j].startswith("      #") and "transcribe-cpp ships" in lines[j]):
                              insert_at = j
                              break
                      break
              if insert_at is None:
                  raise SystemExit("Could not find insert point for unsigned patch")
              patch = """      - name: Disable Windows signCommand and updater artifacts when not signing
        if: contains(inputs.platform, 'windows') && !inputs.sign-binaries
        shell: bash
        run: |
          jq 'del(.bundle.windows.signCommand) | .bundle.createUpdaterArtifacts = false' src-tauri/tauri.conf.json > tmp.json
          mv tmp.json src-tauri/tauri.conf.json
          echo "Cleared signCommand and createUpdaterArtifacts (unsigned build)"

"""
              lines.insert(insert_at, patch)
              p.write_text("".join(lines))
              print(f"Inserted unsigned patch at line {insert_at}")
          PY

      - name: Verify no conflict markers + NPU still present
        run: |
          set -euo pipefail
          if git grep -n '<<<<<<<' -- . 2>/dev/null; then
            echo "ERROR: conflict markers remain"
            exit 1
          fi
          grep -n 'OpenVino\|Npu' src-tauri/src/settings.rs | head -5
          grep -n 'OrtAccelerator::Npu\|OpenVino' src-tauri/src/managers/transcription.rs | head -5
          grep -E 'version = |transcribe-rs|transcribe-cpp' src-tauri/Cargo.toml | head -10
          test -f src-tauri/src/audio_toolkit/lang_id.rs && echo "lang_id.rs present" || echo "WARN: lang_id.rs missing"
          test -f src-tauri/src/memory.rs && echo "memory.rs present" || echo "WARN: memory.rs missing"

      - name: Commit and push full merge
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            git log --oneline -5
            exit 0
          fi
          git commit -m "merge(upstream): full Handy 0.9.5 into feature/intel-npu

- Cargo.toml: 0.9.5 + gkuhns/transcribe-rs ort-openvino
- build.yml: upstream + unsigned NPU installer patch
- NPU OpenVino/Npu settings preserved through merge"
          git push origin HEAD:feature/intel-npu
          echo "Pushed $(git rev-parse HEAD)"
          git log --oneline -5
