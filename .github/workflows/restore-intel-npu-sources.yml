name: restore-intel-npu-sources

on:
  workflow_dispatch:
  push:
    branches: [feature/intel-npu]
    paths:
      - 'docs/intel-npu/.restore-marker'

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/intel-npu
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore settings.rs from upstream main and patch OpenVino/Npu
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/cjpais/Handy/main/src-tauri/src/settings.rs" -o src-tauri/src/settings.rs
          python3 <<'PY'
          from pathlib import Path
          p = Path("src-tauri/src/settings.rs")
          s = p.read_text()
          if "OpenVino" in s and "Npu," in s:
              print("settings already has OpenVino/Npu")
          else:
              # Flexible insert before the closing of the enum
              needle = "    Rocm,\n}"
              if needle not in s:
                  # try with possible whitespace
                  import re
                  m = re.search(r"    Rocm,\s*\n\}", s)
                  if not m:
                      raise SystemExit("settings pattern (Rocm,) not found")
                  s = s[:m.start()] + "    Rocm,\n    /// Intel OpenVINO (CPU/GPU/NPU via OpenVINO EP).\n    OpenVino,\n    /// Intel NPU via OpenVINO (`device_type=NPU`).\n    Npu,\n}" + s[m.end():]
              else:
                  s = s.replace(needle, "    Rocm,\n    /// Intel OpenVINO (CPU/GPU/NPU via OpenVINO EP).\n    OpenVino,\n    /// Intel NPU via OpenVINO (`device_type=NPU`).\n    Npu,\n}", 1)
              p.write_text(s)
              print("settings patched with OpenVino/Npu")
          print("settings.rs lines:", len(p.read_text().splitlines()))
          assert "OpenVino" in p.read_text()
          PY

      - name: Restore transcription.rs from upstream and patch mapping
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/cjpais/Handy/main/src-tauri/src/managers/transcription.rs" -o src-tauri/src/managers/transcription.rs
          python3 <<'PY'
          from pathlib import Path
          p = Path("src-tauri/src/managers/transcription.rs")
          t = p.read_text()
          if "OrtAccelerator::Npu" in t:
              print("transcription already patched")
          else:
              old = "OrtAcceleratorSetting::Rocm => accel::OrtAccelerator::Rocm,"
              if old not in t:
                  raise SystemExit("transcription Rocm arm not found")
              t = t.replace(old, old + "\n        OrtAcceleratorSetting::OpenVino => accel::OrtAccelerator::OpenVino,\n        OrtAcceleratorSetting::Npu => accel::OrtAccelerator::Npu,", 1)
              p.write_text(t)
              print("transcription patched")
          print("transcription.rs lines:", len(p.read_text().splitlines()))
          assert "OrtAccelerator::Npu" in p.read_text()
          PY

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "gkuhns"
          git config user.email "gkuhns@gmail.com"
          git add src-tauri/src/settings.rs src-tauri/src/managers/transcription.rs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(intel-npu): restore full settings.rs + transcription.rs from upstream with OpenVino/Npu"
          git push origin HEAD:feature/intel-npu
