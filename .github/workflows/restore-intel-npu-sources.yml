name: restore-intel-npu-sources

on:
  workflow_dispatch:
  push:
    branches: [feature/intel-npu]
    paths:
      - 'docs/intel-npu/.restore-marker'

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/intel-npu
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore settings.rs from known-good base and patch OpenVino/Npu
        run: |
          set -euo pipefail
          curl -fsSL "https://cdn.jsdelivr.net/gh/gkuhns/Handy@b1b2d9f9072e55902a46ca6cc655e5893ed7a91d/src-tauri/src/settings.rs" \
            -o src-tauri/src/settings.rs
          python3 <<'PY'
          from pathlib import Path
          p = Path("src-tauri/src/settings.rs")
          s = p.read_text()
          old = """    #[serde(rename = \"directml\")]
    DirectMl,
    Rocm,
}"""
          new = """    #[serde(rename = \"directml\")]
    DirectMl,
    Rocm,
    /// Intel OpenVINO (CPU/GPU/NPU via OpenVINO EP).
    OpenVino,
    /// Intel NPU via OpenVINO (`device_type=NPU`).
    Npu,
}"""
          if "OpenVino" in s and "Npu," in s:
              print("settings already has OpenVino/Npu")
          elif old not in s:
              raise SystemExit("settings pattern not found")
          else:
              p.write_text(s.replace(old, new, 1))
              print("settings patched")
          PY

      - name: Restore transcription.rs from known-good base and patch mapping
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/gkuhns/Handy/b0b05002d2ef1ea40c231740c9059916e60b46f6/src-tauri/src/managers/transcription.rs" \
            -o src-tauri/src/managers/transcription.rs
          python3 <<'PY'
          from pathlib import Path
          p = Path("src-tauri/src/managers/transcription.rs")
          t = p.read_text()
          old = """        OrtAcceleratorSetting::Rocm => accel::OrtAccelerator::Rocm,
    };"""
          new = """        OrtAcceleratorSetting::Rocm => accel::OrtAccelerator::Rocm,
        OrtAcceleratorSetting::OpenVino => accel::OrtAccelerator::OpenVino,
        OrtAcceleratorSetting::Npu => accel::OrtAccelerator::Npu,
    };"""
          if "OrtAccelerator::Npu" in t:
              print("transcription already patched")
          elif old not in t:
              raise SystemExit("transcription pattern not found")
          else:
              p.write_text(t.replace(old, new, 1))
              print("transcription patched")
          PY

      - name: Restore full installer.nsi + ensure relative path include
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/gkuhns/Handy/b3596dc90c36c1f402376c5a377b75b5e212400d/src-tauri/nsis/installer.nsi" \
            -o src-tauri/nsis/installer.nsi
          python3 <<'PY'
          from pathlib import Path
          p = Path("src-tauri/nsis/installer.nsi")
          s = p.read_text()
          if r'..\\..\\..\\..\\nsis\\intel-npu-drivers.nsh' not in s and '..\\..\\..\\..\\nsis\\intel-npu-drivers.nsh' not in s:
              print('installer check')
          lines = len(p.read_text().splitlines())
          print(f"installer.nsi lines: {lines}")
          if lines < 1000:
              raise SystemExit(f"installer.nsi still too short ({lines} lines)")
          PY

      - name: Ensure intel-npu-drivers.nsh exists
        run: |
          set -euo pipefail
          if [ ! -f src-tauri/nsis/intel-npu-drivers.nsh ]; then
            echo "intel-npu-drivers.nsh missing - cannot restore"
            exit 1
          fi
          echo "intel-npu-drivers.nsh present ($(wc -l < src-tauri/nsis/intel-npu-drivers.nsh) lines)"

      - name: Restore build.yml (fix PLACEHOLDER) + disable createUpdaterArtifacts on unsigned builds
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/gkuhns/Handy/fb58aa218a597d413eb361bcfc28f7a1380205da/.github/workflows/build.yml" \
            -o .github/workflows/build.yml
          python3 <<'PY'
          from pathlib import Path
          p = Path(".github/workflows/build.yml")
          text = p.read_text()
          old = "jq 'del(.bundle.windows.signCommand)' src-tauri/tauri.conf.json > tmp.json"
          new = "jq 'del(.bundle.windows.signCommand) | .bundle.createUpdaterArtifacts = false' src-tauri/tauri.conf.json > tmp.json"
          if old not in text:
              raise SystemExit("expected jq line not found")
          text = text.replace(old, new, 1)
          old_echo = 'echo "Cleared bundle.windows.signCommand (unsigned build)"'
          new_echo = 'echo "Cleared bundle.windows.signCommand and createUpdaterArtifacts (unsigned build)"'
          if old_echo not in text:
              raise SystemExit("expected echo line not found")
          text = text.replace(old_echo, new_echo, 1)
          text = text.replace(
              "Disable Windows custom signCommand when not signing",
              "Disable Windows custom signCommand and updater artifacts when not signing",
              1,
          )
          p.write_text(text)
          print("build.yml restored and patched", len(text), "bytes")
          PY

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "gkuhns"
          git config user.email "gkuhns@gmail.com"
          git add \
            src-tauri/src/settings.rs \
            src-tauri/src/managers/transcription.rs \
            src-tauri/nsis/installer.nsi \
            src-tauri/nsis/intel-npu-drivers.nsh \
            .github/workflows/build.yml \
            || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "ci(intel-npu): restore build.yml + disable createUpdaterArtifacts on unsigned builds"
          git push origin HEAD:feature/intel-npu
