name: restore-intel-npu-sources

on:
  workflow_dispatch:
  push:
    branches: [feature/intel-npu]
    paths:
      - 'docs/intel-npu/.restore-marker'

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/intel-npu
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore settings.rs from upstream main and patch OpenVino/Npu
        run: |
          set -euo pipefail
          # Full current upstream settings.rs (cjpais/Handy main)
          curl -fsSL "https://raw.githubusercontent.com/cjpais/Handy/main/src-tauri/src/settings.rs" \
            -o src-tauri/src/settings.rs
          python3 <<'PY'
          from pathlib import Path
          p = Path("src-tauri/src/settings.rs")
          s = p.read_text()
          old = """    #[serde(rename = \"directml\")]
    DirectMl,
    Rocm,
}"""
          new = """    #[serde(rename = \"directml\")]
    DirectMl,
    Rocm,
    /// Intel OpenVINO (CPU/GPU/NPU via OpenVINO EP).
    OpenVino,
    /// Intel NPU via OpenVINO (`device_type=NPU`).
    Npu,
}"""
          if "OpenVino" in s and "Npu," in s:
              print("settings already has OpenVino/Npu")
          elif old not in s:
              raise SystemExit("settings pattern not found")
          else:
              p.write_text(s.replace(old, new, 1))
              print("settings patched with OpenVino/Npu")
          print("settings.rs lines:", len(p.read_text().splitlines()))
          PY

      - name: Restore transcription.rs from known-good and patch mapping
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/gkuhns/Handy/b0b05002d2ef1ea40c231740c9059916e60b46f6/src-tauri/src/managers/transcription.rs" \
            -o src-tauri/src/managers/transcription.rs || true
          if ! grep -q "OrtAcceleratorSetting::Rocm" src-tauri/src/managers/transcription.rs 2>/dev/null; then
            curl -fsSL "https://raw.githubusercontent.com/cjpais/Handy/main/src-tauri/src/managers/transcription.rs" \
              -o src-tauri/src/managers/transcription.rs
          fi
          python3 <<'PY'
          from pathlib import Path
          p = Path("src-tauri/src/managers/transcription.rs")
          t = p.read_text()
          old = """        OrtAcceleratorSetting::Rocm => accel::OrtAccelerator::Rocm,
    };"""
          new = """        OrtAcceleratorSetting::Rocm => accel::OrtAccelerator::Rocm,
        OrtAcceleratorSetting::OpenVino => accel::OrtAccelerator::OpenVino,
        OrtAcceleratorSetting::Npu => accel::OrtAccelerator::Npu,
    };"""
          if "OrtAccelerator::Npu" in t:
              print("transcription already patched")
          elif old not in t:
              print("transcription pattern not found, trying alt")
              if "OrtAcceleratorSetting::Rocm" in t and "OpenVino" not in t:
                  t = t.replace(
                      "OrtAcceleratorSetting::Rocm => accel::OrtAccelerator::Rocm,",
                      "OrtAcceleratorSetting::Rocm => accel::OrtAccelerator::Rocm,\n        OrtAcceleratorSetting::OpenVino => accel::OrtAccelerator::OpenVino,\n        OrtAcceleratorSetting::Npu => accel::OrtAccelerator::Npu,"
                  )
                  p.write_text(t)
                  print("transcription patched (alt)")
              else:
                  print("skipping transcription patch")
          else:
              p.write_text(t.replace(old, new, 1))
              print("transcription patched")
          PY

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "gkuhns"
          git config user.email "gkuhns@gmail.com"
          git add src-tauri/src/settings.rs src-tauri/src/managers/transcription.rs || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(intel-npu): restore full settings.rs from upstream + OpenVino/Npu"
          git push origin HEAD:feature/intel-npu
