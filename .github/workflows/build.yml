name: "Build"

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      target:
        required: true
        type: string
      build-args:
        required: false
        type: string
        default: ""
      release-id:
        required: false
        type: string
      asset-prefix:
        required: false
        type: string
        default: "handy"
      asset-name-pattern:
        required: false
        type: string
        default: ""
      upload-artifacts:
        required: false
        type: boolean
        default: false
      sign-binaries:
        required: false
        type: boolean
        default: false
      repository:
        required: false
        type: string
      ref:
        required: false
        type: string
        default: ${{ github.ref }}
      is-debug-build:
        required: false
        type: boolean
        default: false
      no-cache:
        required: false
        type: boolean
        default: false

jobs:
  build:
    permissions:
      contents: write
    runs-on: ${{ inputs.platform }}
    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Vulkan SDK (Windows x64)
        if: contains(inputs.platform, 'windows') && !contains(inputs.target, 'aarch64')
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: install frontend dependencies
        run: bun install

      - name: Extend OrtAcceleratorSetting TypeScript union
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = "src/bindings.ts"
          $t = Get-Content $path -Raw
          $old = 'export type OrtAcceleratorSetting = "auto" | "cpu" | "cuda" | "directml" | "rocm"'
          $new = 'export type OrtAcceleratorSetting = "auto" | "cpu" | "cuda" | "directml" | "rocm" | "openvino" | "open_vino" | "npu"'
          if ($t.Contains($old)) {
            Set-Content -Path $path -Value ($t.Replace($old, $new)) -NoNewline
            Write-Host "patched bindings.ts OrtAcceleratorSetting"
          } else {
            Write-Host "bindings.ts already extended or unexpected union"
          }

      - name: Locate VC++ runtime redist for app-local bundling (Windows)
        if: contains(inputs.platform, 'windows')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -property installationPath
          $versionFile = Join-Path $vsRoot "VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt"
          $redistVersion = (Get-Content $versionFile).Trim()
          $arch = if ("${{ inputs.target }}" -like "aarch64*") { "arm64" } else { "x64" }
          $archDir = Join-Path $vsRoot "VC\Redist\MSVC\$redistVersion\$arch"
          $crt = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.CRT" | Sort-Object Name | Select-Object -Last 1
          $dirs = $crt.FullName
          if ($arch -eq "x64") {
            $omp = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.OpenMP" | Sort-Object Name | Select-Object -Last 1
            $dirs = "$($crt.FullName);$($omp.FullName)"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "HANDY_VC_REDIST_DIRS=$dirs"

      - name: Install ONNX Runtime (Windows x64)
        if: contains(inputs.platform, 'windows') && !contains(inputs.target, 'aarch64')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ORT_VERSION = "1.24.2"
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/onnxruntime-win-x64-$ORT_VERSION.zip"
          Invoke-WebRequest -Uri $url -OutFile ort.zip
          Expand-Archive -Path ort.zip -DestinationPath ort-dist -Force
          $ortLib = (Resolve-Path "ort-dist/onnxruntime-win-x64-$ORT_VERSION/lib").Path
          Add-Content -Path $env:GITHUB_ENV -Value "ORT_LIB_LOCATION=$ortLib"
          Add-Content -Path $env:GITHUB_ENV -Value "ORT_PREFER_DYNAMIC_LINK=1"

      - name: Bundle Intel OpenVINO EP + runtime DLLs (Windows x64)
        if: contains(inputs.platform, 'windows') && !contains(inputs.target, 'aarch64')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = "Intel.ML.OnnxRuntime.EP.OpenVINO"
          $ver = "1.7.0"
          $url = "https://www.nuget.org/api/v2/package/$pkg/$ver"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile ov-ep.nupkg
          Expand-Archive -Path ov-ep.nupkg -DestinationPath ov-ep-nupkg -Force
          $srcDir = "ov-ep-nupkg\runtimes\win-x64\native"
          if (-not (Test-Path $srcDir)) { throw "Missing $srcDir" }
          $pluginSrc = Join-Path $srcDir "onnxruntime_providers_openvino_plugin.dll"
          if (-not (Test-Path $pluginSrc)) { throw "Missing $pluginSrc" }
          $dest = "src-tauri\openvino-ep"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path (Join-Path $srcDir "*") -Destination $dest -Force
          Copy-Item $pluginSrc (Join-Path $dest "onnxruntime_providers_openvino.dll") -Force
          Write-Host "Staged OpenVINO files into $dest"
          Get-ChildItem $dest | ForEach-Object { Write-Host "  $($_.Name) $($_.Length)" }

      - name: Install SPIRV-Headers for transcribe-cpp Vulkan build (Windows x64)
        if: contains(inputs.platform, 'windows') && !contains(inputs.target, 'aarch64')
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          $combined = if ($env:CMAKE_PREFIX_PATH) { "$prefix;$env:CMAKE_PREFIX_PATH" } else { $prefix }
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$combined"
          Write-Host "CMAKE_PREFIX_PATH=$combined"

      - name: Disable Windows signCommand and updater artifacts when not signing
        if: contains(inputs.platform, 'windows') && !inputs.sign-binaries
        shell: bash
        run: |
          jq 'del(.bundle.windows.signCommand) | .bundle.createUpdaterArtifacts = false' src-tauri/tauri.conf.json > tmp.json
          mv tmp.json src-tauri/tauri.conf.json
          echo Cleared signCommand

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.sign-binaries && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.sign-binaries && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          args: ${{ inputs.build-args }}

      - name: Upload artifacts (Windows)
        if: inputs.upload-artifacts && contains(inputs.platform, 'windows')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.asset-prefix }}-${{ inputs.target }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
