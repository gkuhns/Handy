name: Overlay refresh from upstream Handy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/intel-npu
          fetch-depth: 0
          token: ${{ secrets.PUSH_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "gkuhns"
          git config user.email "gkuhns@users.noreply.github.com"

      - name: Patch OpenVINO serde aliases and TS union
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path("src-tauri/src/settings.rs")
          t = p.read_text()
          old = """    Rocm,
    /// Intel OpenVINO (CPU/GPU/NPU via OpenVINO EP).
    OpenVino,
    /// Intel NPU via OpenVINO (`device_type=NPU`).
    Npu,
}"""
          new = """    Rocm,
    /// Intel OpenVINO AUTO device (CPU/GPU/NPU via OpenVINO EP).
    #[serde(rename = "openvino", alias = "open_vino")]
    OpenVino,
    /// Intel NPU via OpenVINO (`device_type=NPU`).
    #[serde(rename = "npu", alias = "openvino_npu")]
    Npu,
}"""
          if old in t:
              p.write_text(t.replace(old, new, 1))
              print("settings.rs patched")
          elif 'rename = "openvino"' in t:
              print("settings.rs already patched")
          else:
              raise SystemExit("settings.rs pattern not found")

          p = Path("src/bindings.ts")
          t = p.read_text()
          old = 'export type OrtAcceleratorSetting = "auto" | "cpu" | "cuda" | "directml" | "rocm"'
          new = 'export type OrtAcceleratorSetting = "auto" | "cpu" | "cuda" | "directml" | "rocm" | "openvino" | "open_vino" | "npu"'
          if old in t:
              p.write_text(t.replace(old, new, 1))
              print("bindings.ts patched")
          elif '"openvino"' in t and 'OrtAcceleratorSetting' in t:
              print("bindings.ts already patched")
          else:
              raise SystemExit("bindings.ts pattern not found")
          PY
          git add src-tauri/src/settings.rs src/bindings.ts
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "fix(intel-npu): accept openvino/npu setting strings from UI"
            git push origin HEAD:feature/intel-npu
          fi
          git log --oneline -4
