name: Merge upstream 0.9.5 into feature/intel-npu

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/intel-npu
          fetch-depth: 0
          token: ${{ secrets.PUSH_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "gkuhns"
          git config user.email "gkuhns@users.noreply.github.com"

      - name: Fetch and merge upstream main
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/cjpais/Handy.git || true
          git fetch upstream main
          echo "upstream: $(git rev-parse upstream/main)"
          echo "HEAD before: $(git rev-parse HEAD)"
          # Prefer upstream on conflicts; we re-apply NPU after
          git merge upstream/main -X theirs --no-edit -m "merge(upstream): full Handy 0.9.5 into feature/intel-npu" || true

      - name: Clear any remaining conflict markers with upstream
        run: |
          set -euo pipefail
          # For any still-unmerged paths, take upstream (theirs)
          if git diff --name-only --diff-filter=U | grep -q .; then
            git diff --name-only --diff-filter=U | while read -r f; do
              echo "taking upstream for $f"
              git checkout --theirs -- "$f"
              git add -- "$f"
            done
          fi
          # Strip any leftover markers if present
          if git grep -l '<<<<<<<' -- . 2>/dev/null; then
            git grep -l '<<<<<<<' -- . | while read -r f; do
              echo "stripping markers in $f"
              git checkout --theirs -- "$f" || true
              git add -- "$f" || true
            done
          fi

      - name: Re-apply NPU fork in Cargo.toml
        run: |
          set -euo pipefail
          python3 -c '
          import re
          from pathlib import Path
          p = Path("src-tauri/Cargo.toml")
          text = p.read_text()
          text = re.sub(r"^version = \".*\"", "version = \"0.9.5\"", text, count=1, flags=re.M)
          text = re.sub(
              r"transcribe-rs = \{[^}]+\}",
              "transcribe-rs = { git = \"https://github.com/gkuhns/transcribe-rs\", default-features = false, features = [\"onnx\", \"ort-openvino\"] }",
              text,
              count=1,
          )
          if "Fork with Intel OpenVINO" not in text:
              text = text.replace(
                  "transcribe-rs = { git = \"https://github.com/gkuhns/transcribe-rs\"",
                  "# Fork with Intel OpenVINO / NPU support (gkuhns).\n# Aligned to Handy 0.9.5.\ntranscribe-rs = { git = \"https://github.com/gkuhns/transcribe-rs\"",
              )
          for m in ["<<<<<<<", "=======", ">>>>>>>"]:
              assert m not in text, m
          p.write_text(text)
          print("Cargo.toml NPU OK")
          for line in text.splitlines():
              if "transcribe-rs" in line or line.startswith("version ="):
                  print(line)
          '

      - name: Re-apply unsigned NPU build patch
        run: |
          set -euo pipefail
          python3 -c '
          from pathlib import Path
          p = Path(".github/workflows/build.yml")
          lines = p.read_text().splitlines(keepends=True)
          if "Disable Windows signCommand" not in "".join(lines):
              insert_at = None
              for i, line in enumerate(lines):
                  if "SPIRV-Headers" in line and "name:" in line:
                      for j in range(i+1, len(lines)):
                          if lines[j].startswith("      - name:") or lines[j].startswith("      #"):
                              insert_at = j
                              break
                      break
              if insert_at is not None:
                  patch = (
                      "      - name: Disable Windows signCommand and updater artifacts when not signing\n"
                      "        if: contains(inputs.platform, \"windows\") && !inputs.sign-binaries\n"
                      "        shell: bash\n"
                      "        run: |\n"
                      "          jq \"del(.bundle.windows.signCommand) | .bundle.createUpdaterArtifacts = false\" src-tauri/tauri.conf.json > tmp.json\n"
                      "          mv tmp.json src-tauri/tauri.conf.json\n"
                      "          echo Cleared signCommand\n"
                      "\n"
                  )
                  lines.insert(insert_at, patch)
                  p.write_text("".join(lines))
                  print("inserted unsigned patch")
              else:
                  print("WARN: no insert point")
          else:
              print("unsigned patch already present")
          '

      - name: Ensure NPU settings variants exist
        run: |
          set -euo pipefail
          if ! grep -q "OpenVino" src-tauri/src/settings.rs; then
            echo "WARNING: OpenVino missing from settings.rs - may need manual restore"
          else
            echo "NPU settings present:"
            grep -n "OpenVino\|Npu" src-tauri/src/settings.rs | head -5
          fi

      - name: Commit and push
        run: |
          set -euo pipefail
          if git grep -n "<<<<<<<" -- . 2>/dev/null; then
            echo "ERROR: markers remain"
            git grep -n "<<<<<<<" -- . || true
            exit 1
          fi
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "merge(upstream): full Handy 0.9.5 into feature/intel-npu"
          else
            echo "Nothing to commit"
          fi
          echo "HEAD: $(git rev-parse HEAD)"
          git push origin HEAD:feature/intel-npu
          echo "Pushed $(git rev-parse HEAD)"
          git log --oneline -8
          grep -E "version = |transcribe-rs|OpenVino|Npu" src-tauri/Cargo.toml src-tauri/src/settings.rs | head -20 || true
