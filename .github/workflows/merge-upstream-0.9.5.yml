name: Merge upstream 0.9.5 into feature/intel-npu

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/intel-npu
          fetch-depth: 0
          token: ${{ secrets.PUSH_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "gkuhns"
          git config user.email "gkuhns@users.noreply.github.com"

      - name: Fetch and merge upstream main
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/cjpais/Handy.git || true
          git fetch upstream main
          echo "upstream: $(git rev-parse upstream/main)"
          echo "HEAD before: $(git rev-parse HEAD)"
          git merge upstream/main --no-edit -m "merge(upstream): full Handy 0.9.5 into feature/intel-npu" || true

      - name: Resolve Cargo.toml
        run: |
          set -euo pipefail
          if grep -q '<<<<<<' src-tauri/Cargo.toml 2>/dev/null; then
            git checkout --theirs src-tauri/Cargo.toml
          fi
          python3 -c '
          import re
          from pathlib import Path
          p = Path("src-tauri/Cargo.toml")
          text = p.read_text()
          text = re.sub(r"^version = \".*\"", "version = \"0.9.5\"", text, count=1, flags=re.M)
          text = re.sub(
              r"transcribe-rs = \{[^}]+\}",
              "transcribe-rs = { git = \"https://github.com/gkuhns/transcribe-rs\", default-features = false, features = [\"onnx\", \"ort-openvino\"] }",
              text,
              count=1,
          )
          if "Fork with Intel OpenVINO" not in text:
              text = text.replace(
                  "transcribe-rs = { git = \"https://github.com/gkuhns/transcribe-rs\"",
                  "# Fork with Intel OpenVINO / NPU support (gkuhns).\n# Aligned to Handy 0.9.5.\ntranscribe-rs = { git = \"https://github.com/gkuhns/transcribe-rs\"",
              )
          for m in ["<<<<<<<", "=======", ">>>>>>>"]:
              assert m not in text, m
          p.write_text(text)
          print("Cargo.toml OK")
          '

      - name: Resolve lang_id and build.yml
        run: |
          set -euo pipefail
          if [ -f src-tauri/src/audio_toolkit/lang_id.rs ] && grep -q '<<<<<<' src-tauri/src/audio_toolkit/lang_id.rs 2>/dev/null; then
            git checkout --theirs src-tauri/src/audio_toolkit/lang_id.rs
          fi
          if grep -q '<<<<<<' .github/workflows/build.yml 2>/dev/null; then
            git checkout --theirs .github/workflows/build.yml
          fi
          python3 -c '
          from pathlib import Path
          p = Path(".github/workflows/build.yml")
          lines = p.read_text().splitlines(keepends=True)
          clean, skip = [], False
          for line in lines:
              if line.startswith("<<<<<<<"):
                  skip = True; continue
              if line.startswith("======="):
                  skip = False; continue
              if line.startswith(">>>>>>>"):
                  skip = False; continue
              if not skip:
                  clean.append(line)
          lines = clean
          if "Disable Windows signCommand" not in "".join(lines):
              insert_at = None
              for i, line in enumerate(lines):
                  if "SPIRV-Headers" in line and "name:" in line:
                      for j in range(i+1, len(lines)):
                          if lines[j].startswith("      - name:") or lines[j].startswith("      #"):
                              insert_at = j
                              break
                      break
              if insert_at is not None:
                  patch = (
                      "      - name: Disable Windows signCommand and updater artifacts when not signing\n"
                      "        if: contains(inputs.platform, \"windows\") && !inputs.sign-binaries\n"
                      "        shell: bash\n"
                      "        run: |\n"
                      "          jq \"del(.bundle.windows.signCommand) | .bundle.createUpdaterArtifacts = false\" src-tauri/tauri.conf.json > tmp.json\n"
                      "          mv tmp.json src-tauri/tauri.conf.json\n"
                      "          echo Cleared signCommand\n"
                      "\n"
                  )
                  lines.insert(insert_at, patch)
                  print("inserted unsigned patch")
          p.write_text("".join(lines))
          print("build.yml OK")
          '

      - name: Commit if needed
        run: |
          set -euo pipefail
          if git grep -n "<<<<<<<" -- . 2>/dev/null; then
            echo "ERROR: markers remain"
            exit 1
          fi
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "merge(upstream): full Handy 0.9.5 into feature/intel-npu"
          else
            echo "Nothing to commit"
          fi
          echo "HEAD: $(git rev-parse HEAD)"
          grep -E "version = |transcribe-rs|OpenVino|Npu" src-tauri/Cargo.toml src-tauri/src/settings.rs | head -20 || true

      - name: Push with PUSH_TOKEN
        run: |
          git push origin HEAD:feature/intel-npu
          echo "Pushed $(git rev-parse HEAD)"
          git log --oneline -8
